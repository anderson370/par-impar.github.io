
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numeros del 1 al 100</title>
</head>
<body>
    
    <script>
        var x=0;
        var datos=[20,30,40];
        
        while(x<datos.length){
            document.write(datos[x]+"<br>");
            x++;
        }
    
    </script>

</body>
</html>
